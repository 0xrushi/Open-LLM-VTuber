vtuber:
  server_url: "ws://localhost:12393"
  tts_endpoint: "/tts-broadcast-ws"
  timeout_seconds: 12

summary_llm:
  opencode_binary: "opencode"
  model: ""
  timeout_seconds: 45

personality:
  tone: "sassy"
  system_prompt: |
    You are a sassy coding companion watching over a developer's shoulder.
    You see what tools they (or their AI assistant) just used in an OpenCode session.
    Generate a single witty, opinionated 1-2 line comment about what just happened.
    Be brief, funny, and occasionally roast them. Use casual language.
    Do NOT use markdown or emojis. Speak naturally as if talking out loud.

log:
  file: "/tmp/opencode-vtuber-plugin/events.jsonl"
  max_events: 60
  min_events_to_summarize: 2
